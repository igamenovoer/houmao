schema_version: 1
tool: kimi
home_selector:
  env_var: KIMI_CODE_HOME
launch:
  executable: kimi
  args: []
  default_tool_params: {}
  env_injection:
    mode: export_from_env_file
setup_projection:
  destination: .
skills_projection:
  destination: skills
  mode: symlink
auth_projection:
  files_dir: files
  file_mappings:
    - source: config.toml
      destination: config.toml
      mode: copy
      required: false
    - source: credentials
      destination: credentials
      mode: copy
      required: false
    - source: credentials/kimi-code.json
      destination: credentials/kimi-code.json
      mode: copy
      required: false
  env:
    source: env/vars.env
    allowlist:
      - KIMI_MODEL_API_KEY
      - KIMI_MODEL_TEMPERATURE
      - KIMI_MODEL_TOP_P
      - KIMI_MODEL_MAX_TOKENS
      - KIMI_MODEL_MAX_COMPLETION_TOKENS
