[project]
name = "houmao-gateway-qualification-fixtures"
version = "0.1.0"
description = "Synthetic independent gateway plugins and deterministic CLI for qualification"
requires-python = ">=3.11"
dependencies = ["houmao>=2.4,<3"]

[project.entry-points."houmao.gateway_plugins"]
fixture-conflicting = "houmao_gateway_fixtures.plugins:conflicting"
fixture-startup-failure = "houmao_gateway_fixtures.plugins:startup_failure"
fixture-worker-failure = "houmao_gateway_fixtures.plugins:worker_failure"
fixture-unsupported-sdk = "houmao_gateway_fixtures.plugins:unsupported_sdk"
fixture-reserved-route = "houmao_gateway_fixtures.plugins:reserved_route"
fixture-duplicate = "houmao_gateway_fixtures.plugins:startup_failure"
fixture-unselected = "houmao_gateway_fixtures.import_side_effect:definition"
fixture-import-failure = "houmao_gateway_fixtures.import_failure:definition"

[project.scripts]
houmao-fixture-codex = "houmao_gateway_fixtures.fake_codex:main"
tmux = "houmao_gateway_fixtures.fake_tmux:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houmao_gateway_fixtures"]
