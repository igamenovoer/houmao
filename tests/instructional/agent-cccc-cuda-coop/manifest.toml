schema_version = 1
default_problem = "gdn_prefill"

[cuda]
arch = "auto"
nvcc = "nvcc"

[delivery]
default_policy = "batch"
quiet_interval_seconds = 6.0
max_wait_seconds = 15.0

[team]
peers = ["peer-a", "peer-b", "peer-c", "peer-d"]
model = "Qwen/Qwen3.8-27B-FP8"
duration_seconds = 300

[problems.gdn_prefill]
id = "gdn_prefill"
title = "Gated Delta Net (GDN) Prefill"
source_dir = "helpers/problems/gdn_prefill"
expected_workloads = [
    "prefill_balanced",
    "prefill_ragged_init",
    "prefill_long",
    "extended_odd_tail",
    "extended_empty_and_long",
]
rtol = 1e-3
atol = 1e-3
min_speedup = 3.0
stretch_speedup = 10.0

[problems.fused_moe]
id = "fused_moe"
title = "Fused Top-K MoE SwiGLU Block"
source_dir = "helpers/problems/fused_moe"
expected_workloads = [
    "moe_skewed_512",
    "moe_balanced_1024",
    "extended_small_odd_37",
    "extended_heavy_skew_1536",
]
rtol = 1e-3
atol = 1e-3
min_speedup = 3.0
stretch_speedup = 10.0
