[project]
name = "houmao-cccc"
version = "0.2.0"
description = "Owner-bound CCCC chat and deferred Mail integration for Houmao gateways"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["houmao>=2.4,<3", "httpx>=0.28,<0.29"]

[project.entry-points."houmao.gateway_plugins"]
cccc = "houmao_cccc:definition"

[project.scripts]
houmao-cccc = "houmao_cccc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houmao_cccc"]

[tool.hatch.build.targets.sdist]
only-include = ["src/houmao_cccc", "pyproject.toml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
