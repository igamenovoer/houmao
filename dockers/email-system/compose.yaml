name: ${STACK_PROJECT_NAME}

services:
  stalwart:
    image: ${STALWART_IMAGE}
    pull_policy: never
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: https://127.0.0.1:${STALWART_WEBADMIN_PORT:-10082}
      STALWART_RECOVERY_ADMIN: ${STALWART_BOOTSTRAP_USER}:${STALWART_BOOTSTRAP_PASSWORD}
    ports:
      - "127.0.0.1:${STALWART_WEBADMIN_PORT:-10082}:${STALWART_WEBADMIN_PORT:-10082}"
      - "127.0.0.1:${STALWART_IMAP_PORT}:${STALWART_IMAP_PORT}"
      - "127.0.0.1:${STALWART_SUBMISSION_PORT}:${STALWART_SUBMISSION_PORT}"
    volumes:
      - ./.data/stalwart-v1:/var/lib/stalwart
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:${STALWART_HTTP_PORT}/healthz/live >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  jmap-http:
    image: ${JMAP_HTTP_IMAGE:-nginx:1.28-alpine}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      stalwart:
        condition: service_healthy
    environment:
      BULWARK_HTTP_PORT: ${BULWARK_HTTP_PORT:-10081}
      STALWART_HTTP_PORT: ${STALWART_HTTP_PORT}
      STALWART_WEBADMIN_PORT: ${STALWART_WEBADMIN_PORT:-10082}
    ports:
      - "127.0.0.1:${STALWART_HTTP_PORT}:${STALWART_HTTP_PORT}"
      - "127.0.0.1:${BULWARK_HTTP_PORT:-10081}:${BULWARK_HTTP_PORT:-10081}"
    volumes:
      - ./stalwart/jmap-http.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:${STALWART_HTTP_PORT}/healthz/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  bulwark:
    image: ${BULWARK_IMAGE:-ghcr.io/bulwarkmail/webmail:1.21.3}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      jmap-http:
        condition: service_healthy
        restart: true
    # Bulwark's server and the browser use the same loopback JMAP URL.
    network_mode: service:jmap-http
    environment:
      HOSTNAME: 127.0.0.1
      JMAP_SERVER_URL: http://127.0.0.1:${BULWARK_HTTP_PORT:-10081}
      NO_THIRD_PARTY_TRAFFIC: "true"
      SETTINGS_SYNC_ENABLED: "true"
    volumes:
      - bulwark-data:/app/data

volumes:
  bulwark-data:
