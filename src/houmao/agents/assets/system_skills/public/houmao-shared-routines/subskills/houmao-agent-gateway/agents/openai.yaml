interface:
  display_name: "Houmao Agent Gateway"
  short_description: "Operate Houmao gateways, live services, and private Web entry."
  default_prompt: "Use $houmao-shared-routines agent-gateway to attach, configure, discover, or operate a Houmao managed-agent gateway. Use web-entry for a private link to a live Web agent. For generic agent inspection, use $houmao-shared-routines agent-inspect."
policy:
  allow_implicit_invocation: false
