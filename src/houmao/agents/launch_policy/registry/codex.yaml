schema_version: 1
tool: codex
strategies:
  - strategy_id: codex-unattended-0.162-plus
    operator_prompt_mode: unattended
    backends:
      - raw_launch
      - codex_headless
      - cao_rest
    supported_versions: ">=0.162.1"
    minimal_inputs:
      credential_forms:
        - auth.json
        - config-backed env-only provider with requires_openai_auth=false, wire_api=responses, and its declared env_key present
      requires_user_prepared_state: false
      notes:
        - Runtime-owned config.toml synthesis force-overrides trust, approval, sandbox, and no-prompt startup surfaces in the runtime home.
        - Missing Codex model selection remains provider-owned; only known legacy model pins may be migrated.
        - Caller launch args and config overrides that target unattended-owned no-prompt surfaces are canonicalized away.
        - Final Codex CLI --config overrides force approval_policy, sandbox_mode, notice.hide_full_access_warning, and tui.show_tooltips over project-local config.
        - User-authored no-prompt config files are not required.
        - Codex 0.162 removed the `-a untrusted` approval flag; only `on-request` and `never` remain.
        - Codex 0.162 renders the workspace-trust screen under full bypass in untrusted git workdirs, so the runtime-owned trust preseed stays load-bearing for unattended startup.
    system_prompt:
      method: native_developer_instructions
      owned_surface: developer_instructions
      precedence_conflicts: []
      required_engine_env: {}
      evidence:
        - kind: source_reference
          ref: src/houmao/agents/realm_controller/backends/codex_headless.py
          note: Maintained Codex launches use native developer instructions through CLI config or app-server request parameters.
    evidence:
      - kind: source_reference
        ref: extern/orphan/codex/codex-rs/app-server/tests/suite/auth.rs
        note: Codex app-server tests document env-only custom-provider auth with requires_openai_auth=false and wire_api=responses.
      - kind: source_reference
        ref: extern/orphan/codex/codex-rs/core/src/config/edit.rs
        note: Codex source defines project trust, notice.hide_full_access_warning, model_migrations, and TUI config edit surfaces.
      - kind: live_probe
        ref: codex --version
        note: Fresh-home probe on installed codex-cli 0.162.1 (2026-10-12) reached the unattended ready composer with runtime-owned trust preseed, approval_policy=never, sandbox_mode=danger-full-access, and notice/tooltip suppression; the same probe without the trust preseed rendered the `Trust this folder?` screen under full bypass in an untrusted git workdir.
    owned_paths:
      - path: config.toml
        keys:
          - approval_policy
          - sandbox_mode
          - notice.hide_full_access_warning
          - tui.show_tooltips
          - notice.model_migrations.gpt-5.3-codex
          - projects.<resolved_workdir>.trust_level
    actions:
      - kind: provider_hook.call
        params:
          hook_id: codex.canonicalize_unattended_launch_inputs
      - kind: provider_hook.call
        params:
          hook_id: codex.validate_credential_readiness
      - kind: toml.set
        params:
          path: config.toml
          key_path:
            - approval_policy
          value: never
      - kind: toml.set
        params:
          path: config.toml
          key_path:
            - sandbox_mode
          value: danger-full-access
      - kind: toml.set
        params:
          path: config.toml
          key_path:
            - notice
            - hide_full_access_warning
          value: true
      - kind: toml.set
        params:
          path: config.toml
          key_path:
            - tui
            - show_tooltips
          value: false
      - kind: provider_hook.call
        params:
          hook_id: codex.ensure_project_trust
      - kind: provider_hook.call
        params:
          hook_id: codex.ensure_model_migration_state
      - kind: provider_hook.call
        params:
          hook_id: codex.append_unattended_cli_overrides
